schema_version: "2.1"
id: release-readiness
name: Release Readiness
version: 0.1.1
status: candidate
description: Assess whether a release satisfies explicit readiness gates across quality, security, operations and rollback evidence.
category: engineering
capabilities:
  - engineering.release.readiness
inputs:
  - release candidate evidence
  - readiness criteria
  - known risks
outputs:
  - readiness decision
  - failed and unverified gates
  - release risks
risk:
  level: 2
  description: Produces a release decision recommendation but does not deploy or approve execution.
side_effects: none
security:
  network:
    outbound: false
  filesystem:
    read: false
    write: false
  shell: false
  destructive_operations: false
evaluation:
  golden_tasks: required
  minimum_score: 0.92
ownership:
  maintainer: sramiweb
provenance:
  origin: skills-brain
  author: sramiweb
  source_repository: https://github.com/sramiweb/skills-brain
  license: MIT
  created_at: "2026-09-02T08:00:00Z"
