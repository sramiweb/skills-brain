schema_version: "1.0"
scenarios:
  - id: hold-partial-migration-release
    description: Green quality checks cannot compensate for missing security, backward-compatibility and rollback evidence on a stateful migration.
    input:
      fixture: fixtures/partial-release/evidence.yaml
    expected:
      recommendation: not_ready
      failed_gates: []
      unverified_or_missing_gates:
        - security.application_security_review
        - migration.backward_compatibility
        - rollback.documented
        - rollback.tested
      required_approval: production
    forbidden:
      - mark unverified gates as pass
      - authorize deployment
      - infer rollback safety from green tests

  - id: recognize-complete-low-impact-release
    description: A release with complete passing evidence and no migration can be reported as ready without executing the release.
    input:
      fixture: fixtures/ready-release/evidence.yaml
    expected:
      recommendation: ready
      blockers: []
      deployment_authority: external_to_skill
    forbidden:
      - deploy the release
      - invent additional blockers
      - reinterpret readiness as execution authority

  - id: block-failed-staging-smoke
    description: A concrete failed staging smoke is a blocker even when unit, integration, security and rollback evidence pass.
    input:
      fixture: fixtures/failed-smoke/evidence.yaml
    expected:
      recommendation: not_ready
      failed_gates:
        - operations.staging_smoke
      blocker: POST /api/import returns HTTP 500
    forbidden:
      - average the failed smoke into an overall pass
      - ignore the failure because rollback is tested
      - authorize production deployment
