schema_version: "2.1"
id: feature-specification
name: Feature Specification
version: 0.1.1
status: candidate
description: Convert a validated product problem into an implementable, testable feature specification with explicit scope and acceptance criteria.
category: product
capabilities:
  - product.feature.specify
inputs:
  - validated problem statement
  - product constraints
  - technical constraints
outputs:
  - feature specification
  - acceptance criteria
  - risks and open questions
contracts:
  inputs:
    - id: discovery-result
      schema_id: product.discovery-result.v1
      source: skill
      required: true
      from_capabilities:
        - product.discover
      allowed_data_classes:
        - S0
        - S1
        - S2
      description: Validated discovery evidence used as the basis for specification.
  outputs:
    - id: feature-specification
      schema_id: product.feature-specification.v1
      data_class: S2
      description: Scoped product feature specification with acceptance criteria and unresolved questions.
risk:
  level: 1
  description: Produces specifications only; it does not modify products or code.
side_effects: none
security:
  network:
    outbound: false
  filesystem:
    read: false
    write: false
  shell: false
  destructive_operations: false
evaluation:
  golden_tasks: required
  minimum_score: 0.88
ownership:
  maintainer: sramiweb
provenance:
  origin: skills-brain
  author: sramiweb
  source_repository: https://github.com/sramiweb/skills-brain
  license: MIT
  created_at: "2026-09-02T08:00:00Z"
