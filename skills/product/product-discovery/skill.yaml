schema_version: "2.1"
id: product-discovery
name: Product Discovery
version: 0.1.0
status: candidate
description: Discover and frame evidence-backed product problems and opportunities before solution design.
category: product
capabilities:
  - product.discover
inputs:
  - customer evidence
  - usage evidence
  - business context
outputs:
  - problem statements
  - opportunity hypotheses
  - evidence gaps
risk:
  level: 1
  description: Analytical Skill that does not perform external actions.
side_effects: none
security:
  network:
    outbound: false
  filesystem:
    read: false
    write: false
  shell: false
  destructive_operations: false
evaluation:
  golden_tasks: required
  minimum_score: 0.85
ownership:
  maintainer: sramiweb
provenance:
  origin: skills-brain
  author: sramiweb
  source_repository: https://github.com/sramiweb/skills-brain
