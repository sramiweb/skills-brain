schema_version: "2.1"
id: agenticos-deploy
aliases:
  - agenticos/agenticos-deploy
name: AgenticOS Deploy
version: 1.0.0
status: candidate
description: Prepare and execute governed AgenticOS deployment workflows with verification and rollback requirements.
category: agenticos
capabilities:
  - agenticos.deploy
  - deployment.orchestrate
  - verification.harness
inputs:
  - deployment target
  - release artifact
  - rollback plan
outputs:
  - deployment result
  - verification evidence
requirements:
  tool_capabilities:
    - filesystem.read
    - filesystem.write
    - shell.execute
    - network.outbound
    - deployment.execute
risk:
  level: 3
  description: Changes external runtime resources and must remain subject to AgenticOS policy and approval gates.
side_effects: external
security:
  network:
    outbound: true
  filesystem:
    read: true
    write: true
  shell: true
  destructive_operations: false
relationships:
  optional:
    - agenticos-security-scan
  related:
    - template-deployment
evaluation:
  golden_tasks: required
  minimum_score: 0.90
ownership:
  maintainer: sramiweb
provenance:
  origin: skills-brain
  author: sramiweb
  source_repository: https://github.com/sramiweb/skills-brain
  derived_from:
    - legacy-v2.0-manifest
  license: MIT
  created_at: "2026-09-01T00:00:00Z"
  last_review: "2026-09-02T07:00:00Z"
compatibility:
  agenticos: ">=3.1"
