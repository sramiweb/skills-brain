schema_version: "2.1"
id: agenticos-migration-runner
aliases:
  - agenticos/agenticos-migration-runner
name: AgenticOS Migration Runner
version: 1.0.0
status: candidate
description: Plan and execute governed database and service migrations with explicit rollback and verification requirements.
category: agenticos
capabilities:
  - agenticos.migration.run
  - database.migrate
  - deployment.migrate
inputs:
  - migration plan
  - target state
  - rollback plan
outputs:
  - migration result
  - verification evidence
requirements:
  tool_capabilities:
    - filesystem.read
    - filesystem.write
    - shell.execute
    - database.write
  skills:
    - agenticos-deploy
risk:
  level: 4
  description: May modify database schema or data and therefore requires the strongest runtime controls.
side_effects: destructive
security:
  network:
    outbound: false
  filesystem:
    read: true
    write: true
  shell: true
  destructive_operations: true
relationships:
  requires:
    - agenticos-deploy
  optional:
    - agenticos-security-scan
evaluation:
  golden_tasks: required
  minimum_score: 0.95
ownership:
  maintainer: sramiweb
provenance:
  origin: skills-brain
  author: sramiweb
  source_repository: https://github.com/sramiweb/skills-brain
  derived_from:
    - legacy-v2.0-manifest
  license: MIT
  created_at: "2026-09-01T00:00:00Z"
  last_review: "2026-09-02T07:00:00Z"
compatibility:
  agenticos: ">=3.1"
