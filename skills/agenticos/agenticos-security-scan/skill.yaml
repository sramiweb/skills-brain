schema_version: "2.1"
id: agenticos-security-scan
aliases:
  - agenticos/agenticos-security-scan
name: AgenticOS Security Scan
version: 1.0.0
status: candidate
description: Perform evidence-based security scanning for AgenticOS deployments without mutating production state.
category: agenticos
capabilities:
  - agenticos.security.scan
  - security.scan
  - verification.security
inputs:
  - deployment artifacts
  - configuration evidence
outputs:
  - security findings
  - remediation recommendations
requirements:
  tool_capabilities:
    - filesystem.read
    - shell.execute
    - security.scan
risk:
  level: 2
  description: Read-oriented security analysis that may execute scanning commands.
side_effects: local
security:
  network:
    outbound: false
  filesystem:
    read: true
    write: false
  shell: true
  destructive_operations: false
relationships:
  optional:
    - agenticos-deploy
  related:
    - template-security-audit
evaluation:
  golden_tasks: required
  minimum_score: 0.90
ownership:
  maintainer: sramiweb
