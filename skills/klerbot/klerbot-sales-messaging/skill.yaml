schema_version: "2.1"
id: klerbot-sales-messaging
name: Klerbot Sales Messaging
version: 0.1.0
status: candidate
description: Provide Klerbot-specific commercial value themes, objection framing, proof discipline and prohibited claims to reusable sales/writing Skills.
category: klerbot
capabilities:
  - klerbot.sales.messaging
inputs:
  - qualified Klerbot prospect or segment context
  - observed prospect pain or objective
  - optional fresh commercial/product evidence
outputs:
  - Klerbot sales-message brief
  - selected value themes and proof points
  - objections, verification needs and prohibited claims
data_classes:
  allowed: [S0, S1, S2]
risk:
  level: 1
  description: Read-only sales guidance; unsupported claims or invented personalization can create trust, compliance and deliverability risk.
side_effects: none
security:
  network:
    outbound: false
  filesystem:
    read: false
    write: false
  shell: false
  destructive_operations: false
relationships:
  related:
    - lead-qualification
    - email-personalization
    - klerbot-ideal-customer-profile
    - klerbot-brand-voice
    - klerbot-product-context
evaluation:
  golden_tasks: required
  minimum_score: 0.90
ownership:
  maintainer: sramiweb
provenance:
  origin: skills-brain
  author: sramiweb
  source_repository: https://github.com/sramiweb/skills-brain
  derived_from:
    - https://github.com/sramiweb/wissql
  license: MIT
  created_at: "2026-09-03T10:00:00Z"
  last_review: "2026-09-03T10:00:00Z"
compatibility:
  agenticos: ">=3.1"
