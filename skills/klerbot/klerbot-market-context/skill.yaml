schema_version: "2.1"
id: klerbot-market-context
name: Klerbot Market Context
version: 0.1.0
status: candidate
description: Provide durable Klerbot market positioning and comparison axes while requiring fresh evidence for dynamic market claims.
category: klerbot
capabilities:
  - klerbot.market.context
inputs:
  - Klerbot market, competitor or positioning mission
  - optional fresh external or customer evidence
outputs:
  - evidence-labeled market context brief
  - comparison axes and substitute categories
  - unknowns and fresh-research requirements
data_classes:
  allowed: [S0, S1, S2]
risk:
  level: 1
  description: Read-only market context; stale or unsupported competitive claims can distort strategy and messaging.
side_effects: none
security:
  network:
    outbound: false
  filesystem:
    read: false
    write: false
  shell: false
  destructive_operations: false
relationships:
  related:
    - competitor-analysis
    - klerbot-product-context
    - klerbot-ideal-customer-profile
    - klerbot-brand-voice
evaluation:
  golden_tasks: required
  minimum_score: 0.90
ownership:
  maintainer: sramiweb
provenance:
  origin: skills-brain
  author: sramiweb
  source_repository: https://github.com/sramiweb/skills-brain
  derived_from:
    - https://github.com/sramiweb/wissql
  license: MIT
  created_at: "2026-09-03T10:00:00Z"
  last_review: "2026-09-03T10:00:00Z"
compatibility:
  agenticos: ">=3.1"
