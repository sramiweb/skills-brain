schema_version: "2.1"
id: application-health
name: Application Health
version: 0.1.0
status: candidate
description: Diagnose application health from infrastructure, application and business-flow evidence rather than a single endpoint status.
category: sre
capabilities:
  - sre.application.health
inputs:
  - infrastructure health evidence
  - application telemetry
  - business-flow checks
outputs:
  - health classification
  - diagnosis
  - missing evidence
requirements:
  tool_capabilities:
    - monitoring.read
    - logs.read
risk:
  level: 2
  description: Read-oriented production diagnosis using monitoring and log evidence.
side_effects: none
security:
  network:
    outbound: false
  filesystem:
    read: false
    write: false
  shell: false
  destructive_operations: false
evaluation:
  golden_tasks: required
  minimum_score: 0.90
ownership:
  maintainer: sramiweb
provenance:
  origin: skills-brain
  author: sramiweb
  source_repository: https://github.com/sramiweb/skills-brain
  license: MIT
  created_at: "2026-09-02T07:00:00Z"
