# Gestion des secrets AgenticOS — deux niveaux complémentaires
# 1) sops : chiffrement au repos dans git (aucun secret en clair, historique compris)
# 2) External Secrets Operator : injection dans K8s depuis un coffre externe
# Preuve attendue : scan gitleaks du dépôt + historique = 0 finding.

# --- .sops.yaml (à la racine du dépôt) ---
# creation_rules:
#   - path_regex: .*\.enc\.yaml$
#     age: age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# Convention : tout fichier *.enc.yaml est chiffré sops ; jamais de .env en clair.
---
# ExternalSecret — injecte les credentials de la passerelle depuis le coffre
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-credentials
  namespace: hermes-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agenticos-vault        # ClusterSecretStore vers le coffre externe
    kind: ClusterSecretStore
  target:
    name: litellm-credentials
    creationPolicy: Owner
  data:
    - secretKey: master-key
      remoteRef:
        key: agenticos/litellm
        property: master_key
    - secretKey: database-url
      remoteRef:
        key: agenticos/litellm
        property: database_url
---
# Exemple de ClusterSecretStore (adapter au coffre : Vault, AWS SM, etc.)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: agenticos-vault
spec:
  provider:
    vault:
      server: "https://vault.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "agenticos"
