# PodSecurityStandards restricted sur les namespaces du socle AgenticOS
# Preuve attendue : un pod non conforme (root, privileged, hostNetwork)
# est rejeté à l'admission.
---
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-agents
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-data
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# SecurityContext minimal attendu sur tout worker agent
# (combiner avec runtimeClassName: gvisor — principe P3)
apiVersion: v1
kind: Pod
metadata:
  name: exemple-worker-agent
  namespace: hermes-agents
spec:
  runtimeClassName: gvisor
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: worker
      image: registry.internal/agenticos/worker:latest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop: ["ALL"]
      env:
        # Passerelle interne uniquement — jamais d'URL fournisseur ni de clé directe
        - name: LLM_GATEWAY_URL
          value: "http://litellm.hermes-system.svc:4000"
