name: Skills Brain CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt

      - name: Reject non-UTF-8 text files
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('skills'), Path('standards'), Path('schemas'), Path('protocols'), Path('tooling')]
          suffixes = {'.md', '.yaml', '.yml', '.json', '.py', '.txt'}
          failures = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in suffixes:
                      try:
                          path.read_text(encoding='utf-8')
                      except UnicodeDecodeError as exc:
                          failures.append(f'{path}: {exc}')
          if failures:
              raise SystemExit('Invalid UTF-8:\n' + '\n'.join(failures))
          print('UTF-8 check passed')
          PY

      - name: Validate canonical skills
        run: python tooling/validate.py --all

      - name: Validate tooling syntax
        run: python -m compileall -q tooling

      - name: Run tests
        run: pytest -q

      - name: Build catalog
        run: python tooling/catalog.py

      - name: Ensure generated catalog is reproducible
        run: |
          if [ -d catalog ]; then
            git diff --exit-code -- catalog || {
              echo "Generated catalog differs from committed catalog. Run python tooling/catalog.py and commit the result."
              exit 1
            }
          fi
