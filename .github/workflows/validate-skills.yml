name: Skills Brain CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt

      - name: Reject non-UTF-8 text files
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('skills'), Path('standards'), Path('schemas'), Path('protocols'), Path('tooling'), Path('core'), Path('tests')]
          suffixes = {'.md', '.yaml', '.yml', '.json', '.py', '.txt'}
          failures = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in suffixes:
                      try:
                          path.read_text(encoding='utf-8')
                      except UnicodeDecodeError as exc:
                          failures.append(f'{path}: {exc}')
          if failures:
              raise SystemExit('Invalid UTF-8:\n' + '\n'.join(failures))
          print('UTF-8 check passed')
          PY

      - name: Validate canonical skills and capability ontology
        run: python tooling/validate.py --all

      - name: Validate tooling syntax
        run: python -m compileall -q tooling

      - name: Run tests
        run: pytest -q

      - name: Evaluate Q0-Q5 evidence
        run: python tooling/evaluator.py

      - name: Block promoted skills without passing evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          report = json.loads(Path('reports/evaluation.json').read_text(encoding='utf-8'))
          failures = []
          for path in Path('skills').rglob('skill.yaml'):
              manifest = yaml.safe_load(path.read_text(encoding='utf-8'))
              if manifest.get('status') not in {'approved', 'active'}:
                  continue
              skill_id = manifest['id']
              result = report.get(skill_id)
              if not result or not result.get('passed'):
                  failures.append(skill_id)
          if failures:
              raise SystemExit('Promoted skills without passing Q0-Q5 evidence: ' + ', '.join(sorted(failures)))
          print('Promotion evidence check passed')
          PY

      - name: Build catalog
        run: python tooling/catalog.py

      - name: Check catalog generator output
        run: |
          test -s catalog/index.json
          test -s catalog/capabilities.json
          test -s catalog/dependencies.json
          test -s catalog/compatibility.json
